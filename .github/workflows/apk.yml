name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear proyecto Android
        run: |
          mkdir -p "$(dirname 'and/settings.gradle.kts')"
          cat > 'and/settings.gradle.kts' <<'KXEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KEVANIX Barber"
          include(":app")
          KXEOF
          mkdir -p "$(dirname 'and/build.gradle.kts')"
          cat > 'and/build.gradle.kts' <<'KXEOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          KXEOF
          mkdir -p "$(dirname 'and/gradle.properties')"
          cat > 'and/gradle.properties' <<'KXEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          KXEOF
          mkdir -p "$(dirname 'and/app/build.gradle.kts')"
          cat > 'and/app/build.gradle.kts' <<'KXEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kevanix.barber"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kevanix.barber"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Para publicar: Build > Generate Signed Bundle / APK (usa tu keystore)
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.12.1")
          }
          KXEOF
          mkdir -p "$(dirname 'and/app/src/main/AndroidManifest.xml')"
          cat > 'and/app/src/main/AndroidManifest.xml' <<'KXEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KXEOF
          mkdir -p "$(dirname 'and/app/src/main/res/values/strings.xml')"
          cat > 'and/app/src/main/res/values/strings.xml' <<'KXEOF'
          <resources>
              <string name="app_name">KEVANIX Barber</string>
          </resources>
          KXEOF
          mkdir -p "$(dirname 'and/app/src/main/res/values/themes.xml')"
          cat > 'and/app/src/main/res/values/themes.xml' <<'KXEOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#111827</item>
                  <item name="android:windowBackground">#111111</item>
              </style>
          </resources>
          KXEOF
          mkdir -p "$(dirname 'and/app/src/main/java/com/kevanix/barber/MainActivity.kt')"
          cat > 'and/app/src/main/java/com/kevanix/barber/MainActivity.kt' <<'KXEOF'
          package com.kevanix.barber

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.webkit.WebViewAssetLoader

          /**
           * KEVANIX Barber – el sistema web va empaquetado en assets/www y se sirve desde
           * https://appassets.androidplatform.net/assets/www/ → funciona sin internet.
           * Firebase sincroniza automáticamente cuando hay conexión.
           */
          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var printView: WebView? = null
              private val startUrl = "https://appassets.androidplatform.net/assets/www/index.html"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)

                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true          // localStorage
                      databaseEnabled = true            // IndexedDB (caché offline de Firebase)
                      allowFileAccess = false
                      allowContentAccess = false
                      setSupportZoom(false)
                      userAgentString = "$userAgentString KXBarberApp/1.0"
                  }
                  web.addJavascriptInterface(PrintBridge(), "KXPrint")
                  web.webChromeClient = WebChromeClient()   // habilita alert / confirm / prompt
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? =
                          loader.shouldInterceptRequest(request.url)

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val url = request.url
                          if (url.host == "appassets.androidplatform.net") return false
                          // WhatsApp, enlaces externos, tel:, mailto: → abrir fuera de la app
                          return try {
                              startActivity(Intent(Intent.ACTION_VIEW, url)); true
                          } catch (e: ActivityNotFoundException) {
                              Toast.makeText(this@MainActivity, "No hay app para abrir el enlace", Toast.LENGTH_SHORT).show(); true
                          }
                      }
                  }

                  if (savedInstanceState != null) web.restoreState(savedInstanceState) else web.loadUrl(startUrl)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else @Suppress("DEPRECATION") super.onBackPressed()
              }

              /** Recibe el HTML de tickets / cierres / liquidaciones y abre el diálogo de impresión de Android. */
              inner class PrintBridge {
                  @JavascriptInterface
                  fun postMessage(html: String) {
                      runOnUiThread {
                          val pv = WebView(this@MainActivity)
                          printView = pv
                          pv.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView, url: String?) {
                                  val pm = getSystemService(PRINT_SERVICE) as PrintManager
                                  pm.print("KEVANIX Barber", view.createPrintDocumentAdapter("ticket"),
                                      PrintAttributes.Builder().build())
                              }
                          }
                          val page = "<html><head><meta charset='utf-8'><style>body{margin:0}.tk{font:12px/1.35 monospace;color:#000}" +
                                  ".c{text-align:center}hr{border:0;border-top:1px dashed #000}td{padding:1px 0}</style></head><body>$html</body></html>"
                          pv.loadDataWithBaseURL(null, page, "text/html", "UTF-8", null)
                      }
                  }
              }
          }
          KXEOF

      - name: Descargar el sistema web (barber.kevanix.com)
        run: |
          W=and/app/src/main/assets/www
          mkdir -p $W/lib and/app/src/main/res/mipmap
          B=https://barber.kevanix.com
          for f in index.html manifest.json logo.png favicon.png icon-192.png icon-512.png lib/firebase-app-compat.js lib/firebase-auth-compat.js lib/firebase-firestore-compat.js; do
            curl -fsSL "$B/$f?v=$GITHUB_RUN_ID" -o "$W/$f"
          done
          grep -q flushPend $W/index.html
          cp $W/icon-192.png and/app/src/main/res/mipmap/ic_launcher.png
          cp $W/logo.png and/app/src/main/res/mipmap/ic_launcher_round.png

      - name: Compilar APK
        working-directory: and
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../KEVANIX-Barber.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KEVANIX-Barber-APK
          path: KEVANIX-Barber.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: KEVANIX Barber APK ${{ github.run_number }}
          body: APK de KEVANIX Barber. Descargá KEVANIX-Barber.apk e instalalo en Android.
          files: KEVANIX-Barber.apk
          make_latest: true
